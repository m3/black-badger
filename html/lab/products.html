<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Badger — Archive [Track 03]</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root {
  --bg: #fdf6f0;
  --fg: #2a2020;
  --primary: #c4708a;
  --secondary: #8b70c4;
  --ink: #1a1a1a;
  --sans: 'Inter', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--fg); line-height: 1.6; }
.halftone { position: fixed; inset: 0; pointer-events: none; opacity: 0.05; background-image: radial-gradient(var(--primary) 1px, transparent 0); background-size: 10px 10px; z-index: 1000; }

.nav { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); }
.nav .logo { font-weight: 900; font-size: 24px; text-transform: uppercase; color: var(--ink); text-decoration: none; letter-spacing: -0.05em; }
.nav .links a { margin-left: 25px; text-decoration: none; color: var(--ink); font-family: var(--mono); font-size: 12px; font-weight: 600; text-transform: uppercase; }
.nav .links a.active { color: var(--primary); }

.container { padding: 60px 40px 100px; max-width: 1400px; margin: 0 auto; }
.header { margin-bottom: 60px; border-left: 8px solid var(--ink); padding-left: 24px; }
.header h1 { font-size: 48px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; margin-bottom: 10px; }
.header p { font-family: var(--mono); font-size: 11px; color: var(--primary); text-transform: uppercase; font-weight: 600; }

.filters { margin-bottom: 40px; display: flex; gap: 15px; flex-wrap: wrap; }
.filter-btn {
  background: #fff;
  border: 3px solid var(--ink);
  color: var(--ink);
  padding: 10px 20px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  transition: transform 0.1s;
}
.filter-btn:hover, .filter-btn.active { background: var(--primary); color: #fff; transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }

.manga-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 40px;
}
.panel-card {
  background: #fff;
  border: 3px solid var(--ink);
  padding: 15px;
  text-decoration: none;
  color: inherit;
  position: relative;
  transition: transform 0.2s;
}
.panel-card::after { content: ''; position: absolute; bottom: -8px; right: -8px; width: 100%; height: 100%; background: var(--ink); z-index: -1; }
.panel-card:hover { transform: translate(-4px, -4px); }

.panel-img {
  width: 100%;
  aspect-ratio: 1;
  background: #f0f0f0;
  border: 2px solid var(--ink);
  margin-bottom: 20px;
  overflow: hidden;
  position: relative;
}
.panel-img img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1); transition: transform 0.5s; }
.panel-card:hover .panel-img img { transform: scale(1.1); }
.panel-img .sfx-tag { position: absolute; top: 10px; right: 10px; background: var(--primary); color: #fff; padding: 2px 8px; font-weight: 900; font-size: 10px; border: 2px solid var(--ink); }

.panel-content { padding: 5px; }
.panel-meta { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--secondary); margin-bottom: 10px; display: block; }
.panel-title { font-size: 20px; font-weight: 900; text-transform: uppercase; color: var(--ink); margin-bottom: 10px; line-height: 1.1; height: 44px; overflow: hidden; }
.panel-price { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ink); }

footer { padding: 40px; border-top: 3px solid var(--ink); display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; font-weight: 600; }

@media (max-width: 1024px) {
  .container { padding: 40px 20px; }
  .manga-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="halftone"></div>

<nav class="nav">
  <a href="../index.html" class="logo">Black<span>Badger</span></a>
  <div class="links">
    <a href="index.html">Episode.01</a>
    <a href="products.html" class="active">Archive</a>
    <a href="about.html">Universe</a>
  </div>
</nav>

<div class="container">
  <div class="header">
    <h1>Material Archive</h1>
    <p>OBJECT_LOG // SCANNING_REPOSITORIES</p>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Show All</button>
    <button class="filter-btn" data-filter="zirconium">The Zircs</button>
    <button class="filter-btn" data-filter="fordite">The Fordites</button>
    <button class="filter-btn" data-filter="damascus">The Forged</button>
  </div>

  <div class="manga-grid" id="grid">
    <!-- Rendered via JS -->
  </div>
</div>

<footer>
  <p>GOT-SWE-ARCHIVE-V3</p>
  <p>© 2025 BLACK BADGER</p>
</footer>

<script src="../data.js"></script>
<script>
const grid = document.getElementById('grid');
const filterBtns = document.querySelectorAll('.filter-btn');

const sfxWords = ['FLASH!', 'GLOW!', 'SPARK!', 'BANG!', 'BAM!', 'ZZZT!'];

function renderGrid(filter = 'all') {
  grid.innerHTML = PRODUCTS
    .filter(p => filter === 'all' || p.material.toLowerCase().includes(filter))
    .map((p, i) => `
      <a href="product.html?slug=${p.slug}" class="panel-card">
        <div class="panel-img">
          <img src="${p.shopifyImages[0]}" alt="${p.title}">
          <span class="sfx-tag">${sfxWords[i % sfxWords.length]}</span>
        </div>
        <div class="panel-content">
          <span class="panel-meta">MODEL.BB_0${i+1}</span>
          <h3 class="panel-title">${p.title}</h3>
          <span class="panel-price">$${p.price}</span>
        </div>
      </a>
    `).join('');
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(btn.dataset.filter);
  });
});

renderGrid();
</script>

</body>
</html>
