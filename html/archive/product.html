<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Badger — Specimen [Track 01]</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root {
  --bg: #002b5c;
  --fg: #ffffff;
  --muted: #4d88ff;
  --accent: #ffcc00;
  --grid: rgba(255, 255, 255, 0.1);
  --line: rgba(255, 255, 255, 0.3);
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--fg);
  background-image: 
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
.nav { padding: 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.nav .logo { font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; text-decoration: none; color: var(--fg); }
.nav .links a { margin-left: 30px; text-decoration: none; color: var(--muted); font-size: 13px; }
.nav .links a.active { color: var(--fg); }

.container { padding: 60px 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }

.specimen-visual {
  position: relative;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.02);
  padding: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 600px;
}
.specimen-visual img {
  max-width: 100%;
  height: auto;
  mix-blend-mode: screen;
}
.specimen-visual .sketch-overlay {
  position: absolute;
  inset: 0;
  opacity: 0.3;
  pointer-events: none;
  background-size: cover;
  background-position: center;
  mix-blend-mode: overlay;
}

.specimen-info .kicker { color: var(--accent); font-size: 10px; text-transform: uppercase; margin-bottom: 20px; display: block; }
.specimen-info h1 { font-size: 48px; text-transform: uppercase; line-height: 1.1; margin-bottom: 24px; letter-spacing: -0.04em; }
.specimen-info .price { font-size: 24px; font-weight: 700; color: var(--fg); margin-bottom: 40px; display: block; }
.specimen-info p { color: var(--muted); font-size: 15px; line-height: 1.8; margin-bottom: 40px; }

.spec-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 60px;
}
.spec-item {
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.spec-item .label { font-size: 10px; color: var(--accent); text-transform: uppercase; display: block; margin-bottom: 4px; }
.spec-item .value { font-size: 14px; font-weight: 500; }

.cta-btn {
  background: var(--accent);
  color: var(--bg);
  padding: 16px 32px;
  border: none;
  font-family: var(--mono);
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
  letter-spacing: 0.1em;
  transition: transform 0.2s;
}
.cta-btn:hover { transform: scale(1.02); }

.lab-note {
  grid-column: span 2;
  border: 1px dashed var(--accent);
  padding: 40px;
  margin-top: 80px;
  background: rgba(255,204,0,0.02);
}
.lab-note h3 { font-size: 14px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; }
.lab-note blockquote { font-size: 24px; line-height: 1.4; color: var(--fg); font-style: italic; }

footer { padding: 40px 100px; border-top: 1px solid var(--line); margin-top: 100px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); grid-column: span 2; }

@media (max-width: 1024px) {
  .container { grid-template-columns: 1fr; padding: 40px; }
  .specimen-visual { min-height: 400px; }
  .lab-note { grid-column: 1; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="../index.html" class="logo">Black<span>Badger</span></a>
  <div class="links">
    <a href="index.html">Archive</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="container" id="content">
  <!-- Dynamic Content -->
</div>

<script src="../data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');
const product = PRODUCTS.find(p => p.slug === slug) || PRODUCTS[1]; // Fallback to 20th Anniv

const content = document.getElementById('content');
content.innerHTML = `
  <div class="specimen-visual">
    ${product.sketches ? `<div class="sketch-overlay" style="background-image: url('../${product.sketches.blueprint}')"></div>` : ''}
    <img src="${product.shopifyImages[0]}" alt="${product.title}">
  </div>
  <div class="specimen-info">
    <span class="kicker">SPECIMEN.0${PRODUCTS.indexOf(product)+1} // DATA_LOADED</span>
    <h1>${product.title}</h1>
    <span class="price">$${product.price}</span>
    <p>${product.description}</p>
    
    <div class="spec-list">
      <div class="spec-item">
        <span class="label">Primary Material</span>
        <span class="value">${product.material.split('/')[0]}</span>
      </div>
      <div class="spec-item">
        <span class="label">Origin</span>
        <span class="value">${product.material.split('/')[1] || 'GOT-LAB'}</span>
      </div>
      <div class="spec-item">
        <span class="label">ID Code</span>
        <span class="value">BB.${product.id.toString().slice(-6)}</span>
      </div>
      <div class="spec-item">
        <span class="label">Status</span>
        <span class="value">AVAILABLE</span>
      </div>
    </div>

    <button class="cta-btn">Initiate Procurement</button>
  </div>

  <div class="lab-note">
    <h3>Lab Note // James Thompson</h3>
    <blockquote>"${product.labNote}"</blockquote>
  </div>

  <footer>
    <p>BLACK BADGER // GOT-2025</p>
    <p>SPEC_TYPE: ${product.slug.toUpperCase()}</p>
  </footer>
`;
</script>

</body>
</html>
