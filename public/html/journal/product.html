<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Badger — Log Entry [Track 02]</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Iowan+Old+Style:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --bg: #f5f0e8;
  --fg: #1a1714;
  --muted: #8a7a68;
  --accent: #8a6a3a;
  --serif: 'Iowan Old Style', 'Charter', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-font-smoothing: antialiased; }
.texture-overlay { position: fixed; inset: 0; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)'/%3E%3C/svg%3E"); z-index: 1000; }

.nav { padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; }
.nav .brand { font-family: var(--serif); font-size: 20px; font-weight: 700; text-decoration: none; color: var(--fg); }
.nav .links a { margin-left: 30px; text-decoration: none; color: var(--muted); font-family: var(--mono); font-size: 11px; text-transform: uppercase; }
.nav .links a.active { color: var(--fg); border-bottom: 1px solid var(--fg); }

.container { padding: 40px 60px 100px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; }

.entry-visual { position: sticky; top: 120px; }
.main-img { background: #fff; padding: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); margin-bottom: 30px; transform: rotate(-1deg); }
.main-img img { width: 100%; display: block; filter: sepia(0.05); }

.process-shots { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.process-img { background: #fff; padding: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); transform: rotate(1deg); }
.process-img img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }

.entry-info .kicker { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 20px; display: block; letter-spacing: 0.15em; }
.entry-info h1 { font-family: var(--serif); font-size: 48px; font-weight: 700; font-style: italic; margin-bottom: 20px; line-height: 1.1; }
.entry-info .price { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--accent); margin-bottom: 40px; display: block; }
.entry-info p { font-size: 17px; line-height: 1.8; color: #4a4440; margin-bottom: 40px; }

.lab-note { background: #fff; border-left: 3px solid var(--accent); padding: 30px; margin-bottom: 40px; position: relative; }
.lab-note::before { content: 'BENCH NOTE'; position: absolute; top: -10px; left: 20px; background: var(--bg); padding: 2px 10px; font-family: var(--mono); font-size: 9px; color: var(--muted); }
.lab-note blockquote { font-family: var(--serif); font-size: 20px; font-style: italic; color: var(--fg); }

.specs-table { border-top: 1px solid #e8e4dc; padding-top: 30px; }
.spec-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.03); }
.spec-label { color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }

.cta-btn { margin-top: 50px; background: var(--fg); color: #fff; border: none; padding: 18px 40px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; border-radius: 2px; }

footer { grid-column: span 2; padding: 60px 0; border-top: 1px solid #e8e4dc; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 80px; }

@media (max-width: 1024px) {
  .container { grid-template-columns: 1fr; padding: 40px 20px; }
  .entry-visual { position: static; }
  footer { grid-column: 1; }
}
</style>
</head>
<body>
<div class="texture-overlay"></div>

<nav class="nav">
  <a href="../index.html" class="brand">Black Badger.</a>
  <div class="links">
    <a href="index.html">Journal</a>
    <a href="products.html">The Archive</a>
    <a href="about.html">Workshop</a>
  </div>
</nav>

<div class="container" id="content">
  <!-- Dynamic Content -->
</div>

<script src="../data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');
const product = PRODUCTS.find(p => p.slug === slug) || PRODUCTS[1];

const content = document.getElementById('content');
content.innerHTML = `
  <div class="entry-visual">
    <div class="main-img">
      <img src="${product.shopifyImages[0]}" alt="${product.title}">
    </div>
    <div class="process-shots">
      <div class="process-img">
        <img src="../${product.process ? product.process[0] : 'mpsn07mt-mpsa3dfj-image.png'}" alt="Process 1">
      </div>
      <div class="process-img">
        <img src="../${product.billet}" alt="Process 2">
      </div>
    </div>
  </div>
  <div class="entry-info">
    <span class="kicker">LOGBOOK ENTRY // NO. 0${PRODUCTS.indexOf(product)+1}</span>
    <h1>${product.title}</h1>
    <span class="price">$${product.price}</span>
    <p>${product.description}</p>
    
    <div class="lab-note">
      <blockquote>"${product.labNote}"</blockquote>
    </div>

    <div class="specs-table">
      <div class="spec-row">
        <span class="spec-label">Material Composition</span>
        <span>${product.material.split('/')[0]}</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Source / Provenance</span>
        <span>${product.material.split('/')[1] || 'Workshop Stock'}</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Work Time</span>
        <span>~42 Hours</span>
      </div>
    </div>

    <button class="cta-btn">Acquire Artifact</button>
  </div>

  <footer>
    <p>© 2025 BLACK BADGER GOT</p>
    <p>LOG_REF: ${product.slug.toUpperCase()}</p>
  </footer>
`;
</script>

</body>
</html>
