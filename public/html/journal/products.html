<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Badger — Logbook [Track 02]</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Iowan+Old+Style:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --bg: #f5f0e8;
  --fg: #1a1714;
  --muted: #8a7a68;
  --accent: #8a6a3a;
  --serif: 'Iowan Old Style', 'Charter', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-font-smoothing: antialiased; }
.texture-overlay { position: fixed; inset: 0; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)'/%3E%3C/svg%3E"); z-index: 1000; }

.nav { padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; }
.nav .brand { font-family: var(--serif); font-size: 20px; font-weight: 700; text-decoration: none; color: var(--fg); }
.nav .links a { margin-left: 30px; text-decoration: none; color: var(--muted); font-family: var(--mono); font-size: 11px; text-transform: uppercase; }
.nav .links a.active { color: var(--fg); border-bottom: 1px solid var(--fg); }

.container { padding: 0 60px 100px; max-width: 1400px; margin: 0 auto; }
.header { margin-bottom: 60px; }
.header h1 { font-family: var(--serif); font-size: 48px; font-weight: 700; margin-bottom: 10px; }
.header p { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

.filters { margin-bottom: 60px; display: flex; gap: 20px; flex-wrap: wrap; }
.filter-btn {
  background: transparent;
  border: 1px solid #e8e4dc;
  color: var(--muted);
  padding: 10px 20px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  text-transform: uppercase;
  border-radius: 2px;
}
.filter-btn:hover, .filter-btn.active { background: #fff; color: var(--fg); border-color: var(--fg); }

.log-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 60px;
}
.log-entry {
  background: #fff;
  padding: 15px;
  box-shadow: 5px 5px 15px rgba(0,0,0,0.05);
  text-decoration: none;
  color: inherit;
  transition: transform 0.3s;
  position: relative;
}
.log-entry:nth-child(even) { transform: rotate(1deg); }
.log-entry:nth-child(odd) { transform: rotate(-1deg); }
.log-entry:hover { transform: translateY(-10px) rotate(0); z-index: 10; }

.log-img {
  width: 100%;
  aspect-ratio: 1;
  background: #f8f8f8;
  margin-bottom: 20px;
  overflow: hidden;
}
.log-img img { width: 100%; height: 100%; object-fit: cover; filter: sepia(0.05) contrast(1.05); }

.log-content { padding: 10px; }
.log-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 15px; display: flex; justify-content: space-between; }
.log-title { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
.log-price { font-family: var(--mono); font-size: 14px; color: var(--accent); font-weight: 600; }

footer { padding: 60px; border-top: 1px solid #e8e4dc; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }

@media (max-width: 1024px) {
  .container, .nav { padding: 40px 20px; }
  .log-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="texture-overlay"></div>

<nav class="nav">
  <a href="../index.html" class="brand">Black Badger.</a>
  <div class="links">
    <a href="index.html">Journal</a>
    <a href="products.html" class="active">The Archive</a>
    <a href="about.html">Workshop</a>
  </div>
</nav>

<div class="container">
  <div class="header">
    <h1>The Logbook</h1>
    <p>Documenting every piece that leaves the bench.</p>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All Entries</button>
    <button class="filter-btn" data-filter="zirconium">The Zircs</button>
    <button class="filter-btn" data-filter="fordite">The Fordites</button>
    <button class="filter-btn" data-filter="damascus">The Forged</button>
  </div>

  <div class="log-grid" id="grid">
    <!-- Rendered via JS -->
  </div>
</div>

<footer>
  <p>© 2025 BLACK BADGER GOT</p>
  <p>GOT-SWE-LOG-V2</p>
</footer>

<script src="../data.js"></script>
<script>
const grid = document.getElementById('grid');
const filterBtns = document.querySelectorAll('.filter-btn');

function renderLog(filter = 'all') {
  grid.innerHTML = PRODUCTS
    .filter(p => filter === 'all' || p.material.toLowerCase().includes(filter))
    .map((p, i) => `
      <a href="product.html?slug=${p.slug}" class="log-entry">
        <div class="log-img">
          <img src="${p.shopifyImages[0]}" alt="${p.title}">
        </div>
        <div class="log-content">
          <div class="log-meta">
            <span>GOT_BENCH_0${i+1}</span>
            <span>2025.05.30</span>
          </div>
          <h3 class="log-title">${p.title}</h3>
          <span class="log-price">$${p.price}</span>
        </div>
      </a>
    `).join('');
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderLog(btn.dataset.filter);
  });
});

renderLog();
</script>

</body>
</html>
