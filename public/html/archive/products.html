<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Badger — Technical Dataset [Track 01]</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root {
  --bg: #002b5c;
  --fg: #ffffff;
  --muted: #4d88ff;
  --accent: #ffcc00;
  --grid: rgba(255, 255, 255, 0.1);
  --line: rgba(255, 255, 255, 0.3);
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--fg);
  background-image: 
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
.nav { padding: 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.nav .logo { font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; text-decoration: none; color: var(--fg); }
.nav .links a { margin-left: 30px; text-decoration: none; color: var(--muted); font-size: 13px; }
.nav .links a.active { color: var(--fg); }

.container { padding: 60px 100px; }
.header { margin-bottom: 60px; }
.header h1 { font-size: 48px; text-transform: uppercase; letter-spacing: -0.04em; margin-bottom: 10px; }
.header p { color: var(--muted); font-size: 14px; }

.filters { margin-bottom: 40px; display: flex; gap: 20px; flex-wrap: wrap; }
.filter-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  padding: 8px 16px;
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  text-transform: uppercase;
}
.filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); }

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 30px;
}
.product-card {
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.02);
  padding: 24px;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, border-color 0.2s;
  text-decoration: none;
  color: inherit;
}
.product-card:hover { border-color: var(--accent); transform: translateY(-4px); }
.product-img {
  width: 100%;
  aspect-ratio: 1;
  background: rgba(255,255,255,0.05);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.product-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.8) contrast(1.2) grayscale(0.5) sepia(0.2) hue-rotate(180deg);
  mix-blend-mode: screen;
}
.product-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  pointer-events: none;
}
.product-meta { font-size: 10px; color: var(--accent); margin-bottom: 8px; display: flex; justify-content: space-between; }
.product-name { font-size: 16px; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; height: 40px; overflow: hidden; }
.product-price { font-size: 14px; color: var(--fg); font-weight: 700; margin-top: auto; }

footer { padding: 40px 100px; border-top: 1px solid var(--line); margin-top: 100px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

@media (max-width: 1024px) {
  .container, footer { padding: 40px; }
  .products-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="../index.html" class="logo">Black<span>Badger</span></a>
  <div class="links">
    <a href="index.html">Archive</a>
    <a href="products.html" class="active">Products</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="container">
  <div class="header">
    <h1>Technical Dataset</h1>
    <p>R1_SYSTEM_CORE // ALL_ARTIFACTS_LOADED</p>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All.Data</button>
    <button class="filter-btn" data-filter="zirconium">Zirc.Alloy</button>
    <button class="filter-btn" data-filter="fordite">Ford.Comp</button>
    <button class="filter-btn" data-filter="damascus">Dam.Steel</button>
    <button class="filter-btn" data-filter="ceramic">Cer.Matrix</button>
  </div>

  <div class="products-grid" id="grid">
    <!-- Rendered via JS -->
  </div>
</div>

<footer>
  <p>BLACK BADGER // GOT-2025</p>
  <p>ALLOY.DOC V.4.0</p>
</footer>

<script src="../data.js"></script>
<script>
const grid = document.getElementById('grid');
const filterBtns = document.querySelectorAll('.filter-btn');

function renderProducts(filter = 'all') {
  grid.innerHTML = PRODUCTS
    .filter(p => filter === 'all' || p.material.toLowerCase().includes(filter))
    .map((p, i) => `
      <a href="product.html?slug=${p.slug}" class="product-card">
        <div class="product-meta">
          <span>ID_${p.id.toString().slice(-4)}</span>
          <span>VER.0${i+1}</span>
        </div>
        <div class="product-img">
          <img src="${p.shopifyImages[0]}" alt="${p.title}">
        </div>
        <div class="product-name">${p.title}</div>
        <div class="product-price">$${p.price}</div>
      </a>
    `).join('');
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts(btn.dataset.filter);
  });
});

renderProducts();
</script>

</body>
</html>
